<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WallCalToDo</title>
    <script>
      // Kiosk workaround: on some Pi/Chromium/compositor combinations the
      // page sometimes fails to render at all on load (blank white
      // screen) — a manual refresh always fixes it, but the exact cause
      // varies. Rather than guess at it, just check a few seconds after
      // load whether real content actually showed up; if not, reload.
      // This runs fresh on every load (no "only once" flag), so it keeps
      // retrying every few seconds until it actually works.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          window.location.reload();
        }
      }, 3000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
